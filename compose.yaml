# Infrastructure owned by RepoMind only. The fixed project name and the unusual
# loopback port keep it isolated from any other Compose project on this machine.
name: repomind

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: repomind-db
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: ${REPOMIND_DB_PASSWORD:-repomind}
      POSTGRES_DB: repomind
    ports:
      - "127.0.0.1:${REPOMIND_DB_PORT:-55432}:5432"
    volumes:
      - repomind-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional local LLM. It starts only with `docker compose --profile llm up -d`,
  # needs no account or API key, and listens on loopback only.
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.6.8
    container_name: repomind-ollama
    environment:
      # Ollama's small default context silently cuts long prompts, which would hide sources.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Keep the machine usable. RepoMind sends one request at a time, but Ollama's defaults
      # kept two models in memory together and reserved twice the context (--parallel 2).
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "2m"
    # A model too big for this limit fails inside this container instead of squeezing other programs.
    mem_limit: 8g
    # Layers that fit in the GPU's memory run there, and the rest on the CPU.
    # Needs an NVIDIA GPU. On a machine without one, remove this line and it runs on the CPU.
    gpus: all
    ports:
      - "127.0.0.1:${REPOMIND_OLLAMA_PORT:-11535}:11434"
    volumes:
      - repomind-ollama:/root/.ollama

volumes:
  repomind-db:
  repomind-ollama:
