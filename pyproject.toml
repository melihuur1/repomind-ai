[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind"
version = "0.1.0"
description = "Intelligent GitHub repository analyzer: syntax-aware code retrieval with verifiable citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Melih Uğur", email = "melihuur1@gmail.com" }]
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-yaml>=0.7,<0.8",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<0.6",
    "fastembed>=0.7,<0.10",
    "numpy>=2",
    "pyyaml>=6",
    "snowballstemmer>=2.2",
    "ctranslate2>=4.5,<5",
    "sentencepiece>=0.2,<0.3",
    "huggingface-hub>=0.24",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
repomind = "repomind.cli:main"

[tool.setuptools.packages.find]
include = ["repomind*"]

[tool.setuptools.package-data]
repomind = ["store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: requires the RepoMind PostgreSQL container (skipped when it is not reachable)",
    "gold: requires local clones of the evaluation repositories (skipped when they are not configured)",
    "llm: calls the configured local LLM (skipped when it is not running)",
]
