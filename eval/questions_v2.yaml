  - id: v2-sn-neg-public-link
    repo: syncnotes
    tr: Bir not herkese açık bağlantıyla nasıl paylaşılıyor?
    en: How is a note shared through a public link?
    absent_terms: [publicLink, shareLink, public_link, share_token]

  - id: v2-sn-neg-ldap
    repo: syncnotes
    tr: SyncNotes LDAP ile kullanıcıları nasıl doğruluyor?
    en: How does SyncNotes authenticate users against LDAP?
    absent_terms: [ldap]

  - id: v2-sn-neg-invite-mail
    repo: syncnotes
    tr: Davet e-postası nasıl gönderiliyor?
    en: How is the invitation email sent?
    absent_terms: [nodemailer, sendgrid, smtp, sendMail]
