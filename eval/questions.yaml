# RepoMind evaluation set.
#
# Rules this file follows (see docs/evaluation.md):
#   * Written from reading the source, before any search code existed. The commit
#     history proves the order: this file predates the first retrieval module.
#   * Questions and gold labels are not changed to improve a score. A label may
#     only change if it is factually wrong about the code, and such a change is
#     recorded in the "corrections" list below together with its reason.
#   * Every gold span carries an anchor: text that must occur inside those lines
#     at the pinned commit. tests/test_gold_labels.py enforces this.
#   * Every "unanswerable" question lists terms proven absent from the indexed
#     source at the pinned commit, so "the code does not do this" is a fact.
#   * The dev/test split is derived from a hash of the id, not chosen by hand.

version: 1

corrections: []

