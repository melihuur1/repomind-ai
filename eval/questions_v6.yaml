# The sixth question set: 48 new questions for the one comparison of v2 with v1.
# Rules, counting and the conditions for a release are in eval/V2_EVALUATION_PLAN.md.
#
# Written on 2026-11-15 by reading the code at the pinned commits, before any of them was asked,
# searched or traced in any version of RepoMind. None repeats an earlier question. The first place
# listed for each answer lies outside every span an earlier question set accepted. A later place may
# overlap one, because a source that really answers the question has to be accepted wherever it is.
#
# After the first question has been asked, nothing in this file changes: no question, no accepted
# place, no label.
#
# How to read it
#   kind: one        the answer is in one place. `places` has one entry, with every place that states it.
#   kind: two        the answer needs two places. `places` has two entries, each with its alternatives.
#   targets_completion: true
#                    one of the four questions asking for the value of a named constant: the line
#                    that uses it and the line that declares it. Reported with and without these.
#   accepted         a source is right when it overlaps one of these line ranges. `anchor` is text
#                    those lines hold at the pinned commit, checked before the run.
#   unanswerable     kind `absent`: the repository has nothing on the subject.
#                    kind `adjacent`: it has the subject, and not the detail that is asked for.
#                    `absent_terms` are checked not to occur in any indexed file.

version: 6

repositories:
  stockguard:
    commit: b6698d81475232f2b8ca95af45336fae5665cd81
  syncnotes:
